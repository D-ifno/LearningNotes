<svg baseProfile="full" height="537" version="1.1" viewBox="0 0 1300 537" width="1300" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="537" width="1300" x="0" y="0" /><text fill="#1F2937" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="bold" text-anchor="start" x="50" y="66">Full Attention + Sliding Window：联合前缀命中</text><text fill="#1F2937" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="normal" text-anchor="start" x="56" y="132">Full Attention</text><text fill="#1F2937" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="bold" text-anchor="end" x="1245" y="132">96 Token</text><rect fill="#E7EBF1" height="36" rx="12" ry="12" stroke="none" stroke-width="1" width="1190" x="55" y="154" /><rect fill="#3E7DD4" height="36" rx="12" ry="12" stroke="none" stroke-width="1" width="892.5" x="55" y="154" /><text fill="#1F2937" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="normal" text-anchor="start" x="56" y="266">Sliding Window</text><text fill="#1F2937" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="bold" text-anchor="end" x="1245" y="266">80 Token</text><rect fill="#E7EBF1" height="36" rx="12" ry="12" stroke="none" stroke-width="1" width="1190" x="55" y="288" /><rect fill="#2E9E69" height="36" rx="12" ry="12" stroke="none" stroke-width="1" width="743.75" x="55" y="288" /><line stroke="#D6DEE8" stroke-width="2" x1="45" x2="1255" y1="374" y2="374" /><text fill="#1F2937" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="bold" text-anchor="start" x="56" y="400">最终有效前缀</text><text fill="#1F2937" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="bold" text-anchor="end" x="1245" y="400">80 Token</text><rect fill="#E7EBF1" height="36" rx="12" ry="12" stroke="none" stroke-width="1" width="1190" x="55" y="422" /><rect fill="#7D8794" height="36" rx="12" ry="12" stroke="none" stroke-width="1" width="743.75" x="55" y="422" /><text fill="#66758A" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="56" y="512">同一前缀必须满足相关 Group 的缓存复用条件（示例刻度：128 Token）。</text></svg>