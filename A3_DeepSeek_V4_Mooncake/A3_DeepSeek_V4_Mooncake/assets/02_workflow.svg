d" marker-end="url(#gray)"/><rect x="100" y="221" width="580" height="65" rx="9" fill="#E8F5F1" stroke="#187B69" stroke-width="1.4"/><text x="390.0" y="249.5" font-size="18" fill="#187B69" font-weight="600" text-anchor="middle">03  Mooncake 池化</text><text x="390.0" y="272.5" font-size="14" fill="#20354A" font-weight="400" text-anchor="middle">启动 Master；配置 MultiConnector</text><path d="M390 286V306" fill="none" stroke="#53677C" stroke-width="2" stroke-linejoin="round" marker-end="url(#gray)"/><rect x="100" y="307" width="580" height="65" rx="9" fill="#E8F5F1" stroke="#187B69" stroke-width="1.4"/><text x="390.0" y="335.5" font-size="18" fill="#187B69" font-weight="600" text-anchor="middle">04  功能验证</text><text x="390.0" y="358.5" font-size="14" fill="#20354A" font-weight="400" text-anchor="middle">检查 Put / Lookup / Get 与跨实例复用</text><path d="M390 372V392" fill="none" stroke="#53677C" stroke-width="2" stroke-linejoin="round" marker-end="url(#gray)"/><rect x="100" y="393" width="580" height="65" rx="9" fill="#F0F4F8" stroke="#53677C" stroke-width="1.4"/><text x="390.0" y="421.5" font-size="18" fill="#53677C" font-weight="600" text-anchor="middle">05  性能测试</text><text x="390.0" y="444.5" font-size="14" fill="#20354A" font-weight="400" text-anchor="middle">AISBench、TTFT、TPOT、吞吐量、池容量</text></g></svg>